name: Build & Sign TaskFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Mematikan modul lokasi bawaan OneSignal agar APK lebih enteng & aman
      ONESIGNAL_DISABLE_LOCATION: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Native Folders
        run: flutter create .

      - name: Ubah Nama, Izin & Konfigurasi Android
        run: |
          # 1. Ganti nama aplikasi jadi Task Flow
          sed -i 's/android:label="[^"]*"/android:label="Task Flow"/' android/app/src/main/AndroidManifest.xml
          
          # 2. Tambah izin INTERNET & POST_NOTIFICATIONS (Wajib untuk OneSignal di Android 13+)
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml
          
          # 3. Kunci minSdkVersion ke 21 (Biar OneSignal tidak komplain saat build)
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts 2>/dev/null || true

      - name: Install Dependencies & Clean Cache
        run: |
          flutter clean
          flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Sign APK (Tanda Tangan Permanen)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # 1. Ubah teks rahasia kembali menjadi file .jks
          echo "$KEYSTORE_BASE64" | base64 -d > taskflow.jks
          
          # 2. Cari alat penanda tangan (apksigner) bawaan mesin Android
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name "apksigner" -type f | sort -r | head -n 1)
          
          # 3. Cap APK menggunakan gembok permanen
          $APKSIGNER sign --ks taskflow.jks --ks-key-alias taskflow --ks-pass pass:taskflow123 --key-pass pass:taskflow123 build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload APK Hasil Akhir
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-Official-APK 
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
